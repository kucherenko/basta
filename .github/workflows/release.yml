name: release

# basta releases from here, on its own schedule, never waiting for a jscpd
# one. The engine lives in the jscpd workspace — next to the tokenizer and
# reporters it shares with the copy/paste detector — and this repository
# carries it as a submodule pinned to one commit. Releasing means moving that
# pointer, committing it and pushing a `v*` tag.
#
# Everything here is idempotent: a version already on a registry is skipped,
# so a re-run after a partial failure finishes the job rather than doubling it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (defaults to the submodule's manifest)"
        required: false
        type: string

concurrency:
  group: basta-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  version:
    name: resolve and check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      # One version, three places: the crate, the npm wrapper and the tag.
      # A release that disagrees with itself ships a wrapper resolving an
      # engine it does not name, which is how jscpd@5.1.0 went out pinned to
      # the 5.0.16 binaries. Fail here instead.
      - name: Resolve version and check it agrees everywhere
        id: version
        working-directory: jscpd/rust
        run: |
          node scripts/sync-version.mjs
          manifest=$(node -p "require('./basta/package.json').version")
          crate=$(grep -m1 '^version = ' crates/basta/Cargo.toml | cut -d'"' -f2)
          [ "$manifest" = "$crate" ] || {
            echo "::error::basta/package.json says ${manifest}, crates/basta/Cargo.toml says ${crate}"
            exit 1
          }

          requested="${{ inputs.version }}"
          if [ -z "$requested" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            requested="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "$requested" ] && [ "$requested" != "$manifest" ]; then
            echo "::error::asked for ${requested} but the tree says ${manifest}"
            exit 1
          fi

          if ! git diff --quiet; then
            echo "::error::sync-version.mjs changed tracked files in the jscpd submodule;"
            echo "::error::commit the sync there and move the submodule pointer before tagging"
            git diff --stat
            exit 1
          fi

          echo "version=${manifest}" >> "$GITHUB_OUTPUT"
          echo "Releasing basta ${manifest}"

  crates:
    name: publish crates.io
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "jscpd/rust -> jscpd/rust/target"
          cache-on-failure: true

      - name: Test
        working-directory: jscpd/rust
        run: cargo test --workspace --locked

      - name: Remove publish = false
        working-directory: jscpd/rust
        run: find crates -name Cargo.toml -exec sed -i '/^publish = false$/d' {} \;

      # Trusted Publishing is configured per crate and per workflow filename,
      # and it can only be configured on a crate that already exists. The very
      # first publish of a new crate therefore has to fall back to the token —
      # and this step must not be fatal, or the job dies before reaching the
      # fallback it already has.
      - name: Authenticate to crates.io (Trusted Publishing)
        id: crates-io-auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Check a crates.io credential is available
        run: |
          if [ -z "${{ steps.crates-io-auth.outputs.token }}" ] && [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "::error::no crates.io credential: Trusted Publishing did not issue a token and CARGO_REGISTRY_TOKEN is unset"
            exit 1
          fi

      # `cargo publish` verifies by building the packaged crate against the
      # *published* versions of its dependencies, not the local paths. basta
      # uses `cpd_core::deadcode`, `cpd_reporter::deadcode` and a public
      # `LineIndex`, none of which exist in the versions currently on
      # crates.io — so basta cannot go out until those do. Rather than wait
      # for a jscpd release, publish whatever basta needs, in dependency
      # order, skipping anything already there.
      - name: Publish basta and any dependency it needs
        working-directory: jscpd/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          order=$(cargo metadata --format-version 1 --no-deps | node -e "
            const meta = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
            const ws = meta.packages.filter(p => !p.id.includes('fuzz'));
            const byName = new Map(ws.map(p => [p.name, p]));
            const seen = new Set(), out = [];
            // Only what basta actually reaches: jscpd is a sibling, not a
            // dependency, and releasing it is not this workflow's business.
            (function visit(name) {
              if (seen.has(name) || !byName.has(name)) return;
              seen.add(name);
              for (const d of byName.get(name).dependencies) {
                if (d.path && byName.has(d.name)) visit(d.name);
              }
              out.push(name + ':' + byName.get(name).version);
            })('basta');
            out.forEach(x => console.log(x));
          ")
          echo "Publish order:"
          echo "$order"

          for entry in $order; do
            crate="${entry%%:*}"
            crate_version="${entry##*:}"
            max_ver=$(curl -sfH "Accept: application/json" -H "User-Agent: jscpd-ci (github.com/kucherenko/jscpd)" \
              "https://crates.io/api/v1/crates/${crate}" 2>/dev/null | jq -r '.crate.max_version // empty' || echo "")
            if [ "$max_ver" = "$crate_version" ]; then
              echo "${crate}@${crate_version} already on crates.io; skipping"
              continue
            fi
            echo "--- publishing ${crate}@${crate_version} ---"
            cargo publish --locked -p "${crate}" --allow-dirty

            # The index has to carry the new version before the next crate
            # can build against it.
            for i in $(seq 1 30); do
              cargo info "${crate}@${crate_version}" >/dev/null 2>&1 && break
              echo "waiting for the index to show ${crate}@${crate_version} ($i/30)"
              sleep 10
            done
          done

  build:
    name: build ${{ matrix.target.key }}
    needs: version
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm publish --provenance
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        target:
          - key: linux-x64-gnu
            os: linux
            cpu: x64
            libc: glibc
            rustTarget: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - key: linux-arm64-gnu
            os: linux
            cpu: arm64
            libc: glibc
            rustTarget: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - key: linux-x64-musl
            os: linux
            cpu: x64
            libc: musl
            rustTarget: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - key: linux-arm64-musl
            os: linux
            cpu: arm64
            libc: musl
            rustTarget: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
          - key: darwin-arm64
            os: darwin
            cpu: arm64
            rustTarget: aarch64-apple-darwin
            runner: macos-latest
          - key: darwin-x64
            os: darwin
            cpu: x64
            rustTarget: x86_64-apple-darwin
            runner: macos-latest
          - key: windows-x64-msvc
            os: win32
            cpu: x64
            rustTarget: x86_64-pc-windows-msvc
            runner: windows-latest
          - key: windows-arm64-msvc
            os: win32
            cpu: arm64
            rustTarget: aarch64-pc-windows-msvc
            runner: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check if platform package is already published
        id: platform-package
        run: |
          version="${{ needs.version.outputs.version }}"
          package_name="basta-${{ matrix.target.key }}"
          if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${version} is already published; skipping build"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.platform-package.outputs.published != 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target.rustTarget }}

      - name: Cache Cargo registry and target
        if: steps.platform-package.outputs.published != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "jscpd/rust -> jscpd/rust/target"
          cache-on-failure: true

      - name: Install cross-compilation tools (Linux ARM64)
        if: steps.platform-package.outputs.published != 'true' && matrix.target.key == 'linux-arm64-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install musl tools
        if: steps.platform-package.outputs.published != 'true' && matrix.target.libc == 'musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # The workspace test suite runs once, in the `crates` job of this same
      # workflow; repeating it per target would multiply CI time for no new
      # signal beyond the per-target build below.
      - name: Build basta
        if: steps.platform-package.outputs.published != 'true'
        working-directory: jscpd/rust
        run: cargo build --release --locked --target ${{ matrix.target.rustTarget }} -p basta

      - name: Verify the built binary reports the expected version
        if: steps.platform-package.outputs.published != 'true' && matrix.target.key != 'darwin-x64' && matrix.target.os != 'win32'
        working-directory: jscpd/rust
        run: |
          expected="${{ needs.version.outputs.version }}"
          built=$(./target/${{ matrix.target.rustTarget }}/release/basta --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [ "$built" = "$expected" ] || { echo "::error::built basta $built, expected $expected"; exit 1; }

      - name: Package platform package
        id: package
        if: steps.platform-package.outputs.published != 'true'
        working-directory: jscpd/rust
        run: |
          package_dir=$(
            node scripts/npm-prebuilt-package.mjs \
              --product basta \
              --target "${{ matrix.target.key }}" \
              --bin-dir "target/${{ matrix.target.rustTarget }}/release" \
              --out-dir "target/npm-prebuilt"
          )
          echo "package_dir=${package_dir}" >> "$GITHUB_OUTPUT"

      # A downloadable, signed archive beside the npm package — for
      # `cargo binstall basta`, air-gapped installs, and anyone who wants
      # the binary without either registry. Binary and LICENSE at the
      # archive root, matching the layout cargo-binstall expects.
      - name: Archive binary for release assets
        if: steps.platform-package.outputs.published != 'true'
        working-directory: jscpd/rust
        run: |
          mkdir -p target/release-assets
          binary_name="basta"
          if [ "${{ matrix.target.os }}" = "win32" ]; then
            binary_name="basta.exe"
          fi
          stage="target/release-assets/stage-${{ matrix.target.key }}"
          rm -rf "$stage" && mkdir -p "$stage"
          cp "target/${{ matrix.target.rustTarget }}/release/$binary_name" "$stage/"
          cp ../../LICENSE "$stage/LICENSE"
          tar -czf "target/release-assets/basta-${{ matrix.target.key }}.tar.gz" \
            -C "$stage" "$binary_name" LICENSE

      - name: Upload binary artifact
        if: steps.platform-package.outputs.published != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: basta-binary-${{ matrix.target.key }}
          path: jscpd/rust/target/release-assets/basta-${{ matrix.target.key }}.tar.gz
          retention-days: 1

      # On a resumed release (platform package already on npm from an earlier
      # run), the build above is skipped — but the release job attaches
      # assets from THIS run's artifacts only. Repack the published npm
      # binary as the release-asset tarball so a resumed release still gets
      # every asset.
      - name: Repack published binary for release assets
        if: steps.platform-package.outputs.published == 'true'
        working-directory: jscpd/rust
        run: |
          version="${{ needs.version.outputs.version }}"
          package_name="basta-${{ matrix.target.key }}"
          mkdir -p target/release-assets repack
          npm pack "${package_name}@${version}" --pack-destination repack >/dev/null
          tar -xzf repack/*.tgz -C repack
          binary_name="basta"
          if [ "${{ matrix.target.os }}" = "win32" ]; then
            binary_name="basta.exe"
          fi
          bin_path=$(find repack/package -name "$binary_name" -type f | head -1)
          [ -n "$bin_path" ] || { echo "::error::${binary_name} not found in ${package_name}@${version}"; exit 1; }
          mkdir -p repack/stage
          cp "$bin_path" repack/stage/
          cp ../../LICENSE repack/stage/LICENSE
          chmod +x "repack/stage/$binary_name"
          tar -czf "target/release-assets/basta-${{ matrix.target.key }}.tar.gz" \
            -C repack/stage "$binary_name" LICENSE

      - name: Upload binary artifact (from published package)
        if: steps.platform-package.outputs.published == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: basta-binary-${{ matrix.target.key }}
          path: jscpd/rust/target/release-assets/basta-${{ matrix.target.key }}.tar.gz
          retention-days: 1

      - name: Publish platform package
        if: steps.platform-package.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: jscpd/rust
        run: |
          version="${{ needs.version.outputs.version }}"
          package_name="basta-${{ matrix.target.key }}"
          if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
            echo "${package_name}@${version} is already published; skipping"
            exit 0
          fi
          npm publish "${{ steps.package.outputs.package_dir }}" --access public --provenance

  publish:
    name: publish basta wrapper
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm publish --provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # npm reads are eventually consistent: a platform package published
      # seconds earlier can still be invisible here. Re-check only what is
      # still missing, against one shared deadline, as the jscpd gate does.
      - name: Verify all platform packages are published
        working-directory: jscpd/rust
        run: |
          version="${{ needs.version.outputs.version }}"
          missing=$(node -e "
            const t = require('./npm/prebuilt-targets.json');
            Object.keys(t).forEach(k => console.log('basta-' + k));
          ")
          deadline=$(( $(date +%s) + 300 ))
          while [ -n "$missing" ]; do
            still=""
            for package_name in $missing; do
              npm view "${package_name}@${version}" version >/dev/null 2>&1 || still="$still $package_name"
            done
            missing=$(echo $still)
            [ -z "$missing" ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::platform packages never appeared on npm:$missing"
              exit 1
            fi
            echo "waiting for:$missing"
            sleep 15
          done
          echo "all basta platform packages are visible at ${version}"

      - name: Publish basta package
        working-directory: jscpd/rust/basta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${{ needs.version.outputs.version }}"
          if npm view "basta@${version}" version >/dev/null 2>&1; then
            echo "basta@${version} is already published; skipping"
            exit 0
          fi
          npm publish --access public --provenance

      # `npm publish` tags what it publishes as `latest`, but the package
      # carries 1.x versions from an unrelated tool, and a dist-tag that
      # silently stayed on those would hand every `npm i basta` the wrong
      # program. Assert it rather than assume it.
      # npm reads are eventually consistent, and a publish says so itself:
      # "Your package is being processed and may take a few minutes to become
      # available." Reading the dist-tag immediately after publishing returns
      # the *previous* one, so this polls to a deadline instead of trusting a
      # single read — the same way the platform-package gate above does.
      - name: Check the latest tag points at this release
        run: |
          version="${{ needs.version.outputs.version }}"
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            latest=$(npm view basta dist-tags.latest 2>/dev/null || echo "")
            [ "$latest" = "$version" ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::basta dist-tag latest is ${latest:-unset}, expected ${version} after 5 minutes;"
              echo "::error::fix with: npm dist-tag add basta@${version} latest"
              exit 1
            fi
            echo "dist-tag still ${latest:-unset}; waiting for the registry to catch up"
            sleep 15
          done
          echo "basta latest -> ${version}"

  # ─── GitHub release ────────────────────────────────────────────────
  # The registries (crates.io, npm) are where `cargo install`/`npm install`
  # look, but a GitHub release is where a person looks for "what changed"
  # and a signed binary to download directly — neither registry gives them
  # that. This is the one place in the pipeline that writes to this repo.
  release:
    name: create basta github release
    needs: [version, crates, build, publish]
    if: always() && !cancelled() &&
      needs.crates.result != 'failure' &&
      needs.build.result != 'failure' &&
      needs.publish.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless signing for build provenance
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: basta-binary-*
          path: release-assets
          merge-multiple: true
        continue-on-error: true

      # Idempotent like every other job here: a re-run (workflow_dispatch, or
      # a retry after an earlier step failed) must not try to recreate a
      # release that already exists — that fails with "Release.tag_name
      # already exists" instead of quietly doing nothing, which is what
      # tripped up kucherenko/jscpd's own release pipeline on 2026-09-18.
      - name: Check whether this release already exists
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ needs.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${tag} already exists; skipping release creation"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        if: steps.existing.outputs.exists != 'true'
        id: notes
        run: |
          notes="Dead code detection for JavaScript, TypeScript, Vue, Svelte, Astro and Python — unused files, exports, module-private declarations and imports, each finding with a confidence score.

          The engine lives in [kucherenko/jscpd](https://github.com/kucherenko/jscpd), where it also ships as \`jscpd --dead-code\`; see [the jscpd changelog](https://github.com/kucherenko/jscpd/blob/master/rust/CHANGELOG.md) for what changed under the hood this release.

          Install: \`npm i -g basta\`, \`cargo install basta\`, or \`cargo binstall basta\`. Without installing: \`npx basta src\`."
          {
            echo "notes<<EOF"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          version="${{ needs.version.outputs.version }}"
          tag="v${version}"

          assets=""
          if [ -d release-assets ] && ls release-assets/*.tar.gz >/dev/null 2>&1; then
            for f in release-assets/*.tar.gz; do
              assets="$assets $f"
            done
          fi

          if [ -n "$assets" ]; then
            gh release create "${tag}" \
              --title "basta v${version}" \
              --notes "$RELEASE_NOTES" \
              --latest \
              $assets
          else
            gh release create "${tag}" \
              --title "basta v${version}" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi

      - name: Generate checksums
        if: steps.existing.outputs.exists != 'true'
        id: checksums
        run: |
          if [ -d release-assets ] && ls release-assets/*.tar.gz >/dev/null 2>&1; then
            (cd release-assets && sha256sum *.tar.gz > checksums.txt)
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      # Signed SLSA provenance for the release binaries, verifiable with
      # `gh attestation verify <asset> --repo kucherenko/basta`. The bundle is
      # also uploaded as a release asset (multiple.intoto.jsonl) so provenance
      # travels with the artifacts.
      - name: Attest build provenance
        if: steps.existing.outputs.exists != 'true' && steps.checksums.outputs.have == 'true'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*.tar.gz

      # Sigstore keyless signatures (in addition to the SLSA attestation) so
      # assets can be verified with plain `cosign verify-blob` and no GitHub
      # CLI. One `<asset>.sigstore.json` bundle per archive plus checksums.txt.
      - name: Install cosign
        if: steps.existing.outputs.exists != 'true' && steps.checksums.outputs.have == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release assets (sigstore keyless)
        if: steps.existing.outputs.exists != 'true' && steps.checksums.outputs.have == 'true'
        working-directory: release-assets
        run: |
          for asset in *.tar.gz checksums.txt; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
          done
          ls -1 ./*.sigstore.json

      - name: Upload checksums, provenance and signatures to release
        if: steps.existing.outputs.exists != 'true' && steps.checksums.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ needs.version.outputs.version }}"
          cp "${{ steps.attest.outputs.bundle-path }}" release-assets/multiple.intoto.jsonl
          gh release upload "${tag}" \
            release-assets/checksums.txt \
            release-assets/multiple.intoto.jsonl \
            release-assets/*.sigstore.json
